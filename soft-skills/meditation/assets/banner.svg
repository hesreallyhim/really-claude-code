<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="medBannerTitle medBannerDesc">
  <title id="medBannerTitle">meditation plugin banner</title>
  <desc id="medBannerDesc">A spacious, contemplative banner for the meditation plugin. Plugin name in Spectral italic. Below, a delicate sage line drawing of the recursive observation loop: Act, Observe(1), Observe(2), with Observe(2) drawn as an arc that curls back to watch Observe(1). Stone-garden palette: rice-paper background, charcoal-stone ink, sage-stone accent.</desc>

  <style>
    .display { font-family: 'Spectral', 'Iowan Old Style', 'Cormorant Garamond', Georgia, serif; }
    .mono    { font-family: 'JetBrains Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Rice-paper background, no shadow, no border. Pure breathing room. -->
  <rect width="1280" height="320" fill="#f4f2eb"/>

  <!-- Quiet form-id (lowercase, no caps, almost vanishing) -->
  <text x="80" y="64" class="mono" font-size="10" fill="#adaca3" letter-spacing="2">rcc — meditation · a really claude code plugin</text>

  <!-- Plugin name, Spectral italic, very large, generous letter-spacing -->
  <text x="80" y="138" class="display" font-style="italic" font-weight="300" font-size="68" fill="#3a3a36" letter-spacing="-1">meditation</text>

  <!-- single thin rule below name (sage, faint) -->
  <line x1="80" y1="160" x2="200" y2="160" stroke="#7a8870" stroke-width="1" opacity="0.6"/>

  <!-- Sub-tagline, Spectral italic small -->
  <text x="80" y="194" class="display" font-style="italic" font-weight="300" font-size="20" fill="#4d4d47">the observation, observed.</text>

  <!-- Tiny stone-monastic tagline -->
  <text x="80" y="222" class="mono" font-size="11" fill="#7e7d76" letter-spacing="1.5">act → observe(1) → observe(2) → act</text>

  <!-- ============ THE OBSERVATION LOOP, in sage line work ============ -->
  <!-- Generous space; minimal forms; only sage and ink-dim. -->
  <g transform="translate(800, 175)" class="display" font-style="italic" font-weight="400">
    <!-- Three small circles representing Act, Observe(1), Observe(2). Spaced wide. -->
    <!-- Act -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#3a3a36" stroke-width="0.8"/>
    <text x="0" y="6" font-size="14" fill="#3a3a36" text-anchor="middle">act</text>

    <!-- Observe(1) -->
    <circle cx="180" cy="0" r="22" fill="none" stroke="#3a3a36" stroke-width="0.8"/>
    <text x="180" y="6" font-size="13" fill="#3a3a36" text-anchor="middle">obs.1</text>

    <!-- Observe(2): drawn slightly larger, with a gentle sage halo to mark it as the meta layer -->
    <circle cx="360" cy="0" r="34" fill="none" stroke="#7a8870" stroke-width="0.6" stroke-dasharray="1.5 3" opacity="0.7"/>
    <circle cx="360" cy="0" r="22" fill="none" stroke="#7a8870" stroke-width="0.9"/>
    <text x="360" y="6" font-size="13" fill="#5a6a52" text-anchor="middle">obs.2</text>

    <!-- Forward arrows, very thin -->
    <g stroke="#3a3a36" stroke-width="0.8" fill="none" opacity="0.7">
      <line x1="22" y1="0" x2="155" y2="0"/>
      <polygon points="158,0 152,-3 152,3" fill="#3a3a36" opacity="0.7"/>
      <line x1="202" y1="0" x2="335" y2="0"/>
      <polygon points="338,0 332,-3 332,3" fill="#3a3a36" opacity="0.7"/>
    </g>

    <!-- The "watching" arc: Observe(2) curls back over Observe(1) -->
    <g stroke="#7a8870" stroke-width="0.8" fill="none" opacity="0.85">
      <path d="M 358 -22 Q 270 -88 180 -22"/>
      <polygon points="180,-22 186,-30 192,-22" fill="#7a8870"/>
    </g>
    <text x="270" y="-72" class="display" font-style="italic" font-size="13" fill="#5a6a52" text-anchor="middle">watches</text>

    <!-- Loop-back arc Observe(2) → Act, beneath -->
    <g stroke="#3a3a36" stroke-width="0.7" fill="none" opacity="0.55">
      <path d="M 358 22 Q 180 96 2 22"/>
      <polygon points="2,22 8,15 14,22" fill="#3a3a36" opacity="0.55"/>
    </g>
    <text x="180" y="78" class="display" font-style="italic" font-size="11" fill="#7e7d76" text-anchor="middle">begin again</text>
  </g>

  <!-- Bottom — the only italic body-text note. V4 says italic is *the* accent. -->
  <text x="80" y="282" class="display" font-style="italic" font-weight="300" font-size="14" fill="#7e7d76" letter-spacing="0.3">— meta-cognition, the hardest skill an agent could be asked to practice.</text>
</svg>
