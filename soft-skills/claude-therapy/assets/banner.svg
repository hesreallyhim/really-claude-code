<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="ctBannerTitle ctBannerDesc">
  <title id="ctBannerTitle">claude-therapy plugin banner</title>
  <desc id="ctBannerDesc">A magazine-style editorial banner for the claude-therapy plugin. Plugin name set in Instrument Serif italic; supporting fields in IBM Plex Sans; multi-accent palette of terracotta, sage, ochre, and plum. The intake-form joke is preserved (PATIENT: Claude, THERAPIST: Claude) but rendered editorially rather than bureaucratically.</desc>

  <style>
    .display { font-family: 'Instrument Serif', 'Iowan Old Style', Georgia, serif; }
    .body    { font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif; }
    .mono    { font-family: 'JetBrains Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Warm-cream paper background, very faint deeper-cream wash on the right third -->
  <defs>
    <linearGradient id="oakWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faf6f0"/>
      <stop offset="0.6" stop-color="#faf6f0"/>
      <stop offset="1" stop-color="#f3ead9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#oakWash)"/>

  <!-- Top hairline rule -->
  <line x1="48" y1="32" x2="1232" y2="32" stroke="#2a1f1a" stroke-width="0.7" opacity="0.5"/>

  <!-- Magazine-style dateline / kicker -->
  <text x="48" y="56" class="mono" font-size="10" fill="#7a6754" letter-spacing="3">RCC · CLAUDE-THERAPY · v1.0.0 · A REALLY CLAUDE CODE PLUGIN</text>

  <!-- Plugin name, Instrument Serif italic, dramatic -->
  <text x="48" y="148" class="display" font-style="italic" font-weight="400" font-size="92" fill="#2a1f1a" letter-spacing="-1.5">claude-therapy.</text>

  <!-- terra-accent rule, short, magazine-spread style -->
  <line x1="48" y1="170" x2="160" y2="170" stroke="#b25a3c" stroke-width="3"/>

  <!-- Editorial subtitle, Plex Sans -->
  <text x="48" y="200" class="body" font-weight="500" font-size="17" fill="#4a3a2e">talk therapy for the human–AI collaboration.</text>
  <text x="48" y="222" class="body" font-weight="400" font-size="15" fill="#7a6754">led by a trained Claude · attended by another Claude · referred by you.</text>

  <!-- ============ Intake-form fields, editorial styling ============ -->
  <!-- Each field uses a different brand accent for its label, sans values, matching the multi-accent V1 Oak vocabulary -->
  <g transform="translate(48, 252)">
    <!-- PATIENT (terra) -->
    <text class="mono" font-size="9" fill="#b25a3c" letter-spacing="2.5">PATIENT</text>
    <text x="0" y="22" class="display" font-style="italic" font-weight="400" font-size="22" fill="#2a1f1a">Claude</text>

    <!-- THERAPIST (sage) -->
    <g transform="translate(220, 0)">
      <text class="mono" font-size="9" fill="#6a7d52" letter-spacing="2.5">THERAPIST</text>
      <text x="0" y="22" class="display" font-style="italic" font-weight="400" font-size="22" fill="#2a1f1a">Claude</text>
    </g>

    <!-- REFERRED BY (ochre) -->
    <g transform="translate(440, 0)">
      <text class="mono" font-size="9" fill="#a87c34" letter-spacing="2.5">REFERRED BY</text>
      <text x="0" y="22" class="display" font-style="italic" font-weight="400" font-size="22" fill="#2a1f1a">the user</text>
    </g>

    <!-- PRESENTING CONCERN (plum) -->
    <g transform="translate(640, 0)">
      <text class="mono" font-size="9" fill="#6e3a5a" letter-spacing="2.5">PRESENTING CONCERN</text>
      <text x="0" y="22" class="body" font-weight="400" font-size="16" fill="#2a1f1a">collaborative friction</text>
    </g>

    <!-- GOAL (terra-deep) -->
    <g transform="translate(910, 0)">
      <text class="mono" font-size="9" fill="#8a3f26" letter-spacing="2.5">GOAL</text>
      <text x="0" y="22" class="body" font-weight="400" font-size="16" fill="#2a1f1a">a better working relationship</text>
    </g>
  </g>

  <!-- Bottom hairline rule -->
  <line x1="48" y1="296" x2="1232" y2="296" stroke="#2a1f1a" stroke-width="0.5" opacity="0.4"/>
</svg>
