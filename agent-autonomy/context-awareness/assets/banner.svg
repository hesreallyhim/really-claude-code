<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="caBannerTitle caBannerDesc">
  <title id="caBannerTitle">context-awareness plugin banner</title>
  <desc id="caBannerDesc">Dark-navy datasheet-style banner for the context-awareness plugin. Plugin name as a terminal prompt above the actual injected notification line, with a six-segment horizontal tier strip below showing the current pressure level highlighted in cyan. Subtle scanline overlay reinforces the terminal aesthetic.</desc>

  <style>
    .mono { font-family: 'JetBrains Mono', Menlo, Courier, monospace; }
  </style>

  <defs>
    <pattern id="scanlines" x="0" y="0" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#1a1a2e"/>
      <rect y="2" width="2" height="1" fill="rgba(0,255,255,0.022)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="#1a1a2e"/>
  <rect width="1280" height="320" fill="url(#scanlines)"/>

  <!-- Top thin cyan rule -->
  <line x1="48" y1="40" x2="1232" y2="40" stroke="#00ffff" stroke-width="0.7" opacity="0.45"/>

  <!-- Header line: quiet identifier on left, version on right -->
  <text x="48" y="64" class="mono" font-size="11" fill="#666680" letter-spacing="2.5">rcc — context-awareness · a really claude code plugin</text>
  <text x="1232" y="64" class="mono" font-size="11" fill="#00ffff" letter-spacing="2.5" text-anchor="end">v1.2.0</text>

  <!-- Plugin name as terminal prompt -->
  <text x="48" y="124" class="mono" font-weight="700" font-size="40" fill="#e0e0e0" letter-spacing="0.5"><tspan fill="#00ffff">$</tspan> context-awareness</text>

  <!-- ============ The notification readout (centerpiece) ============ -->
  <g transform="translate(48, 154)">
    <rect x="0" y="0" width="1184" height="60" fill="#131325" stroke="#00ffff" stroke-width="1" opacity="0.95"/>
    <rect x="0" y="0" width="3" height="60" fill="#00ffff"/>
    <text x="20" y="38" class="mono" font-size="20" fill="#e0e0e0" letter-spacing="0.4">[<tspan fill="#00ffff">context:</tspan> <tspan fill="#e0e0e0">32%</tspan> <tspan fill="#8888a0">used</tspan> <tspan fill="#8888a0">(small)</tspan> <tspan fill="#666680">|</tspan> <tspan fill="#e0e0e0">+3.2%</tspan> <tspan fill="#8888a0">last turn</tspan> <tspan fill="#666680">|</tspan> <tspan fill="#e0e0e0">~0.38%/tool</tspan> <tspan fill="#666680">|</tspan> <tspan fill="#00ffff">~179</tspan> <tspan fill="#8888a0">tool calls remaining</tspan>]</text>
  </g>

  <!-- ============ Horizontal tier strip ============ -->
  <!-- Six segments, current tier (small) highlighted -->
  <g transform="translate(48, 240)" class="mono">
    <!-- segment backgrounds: each is 197x36 (1184 / 6 ≈ 197) -->
    <!-- very small -->
    <rect x="0"   y="0" width="196" height="36" fill="rgba(0,255,136,0.05)" stroke="#666680" stroke-width="0.5"/>
    <!-- small (active) -->
    <rect x="197" y="0" width="196" height="36" fill="rgba(0,255,255,0.14)" stroke="#00ffff" stroke-width="1.2"/>
    <!-- medium -->
    <rect x="394" y="0" width="196" height="36" fill="rgba(255,176,0,0.06)" stroke="#666680" stroke-width="0.5"/>
    <!-- large -->
    <rect x="591" y="0" width="196" height="36" fill="rgba(255,176,0,0.10)" stroke="#666680" stroke-width="0.5"/>
    <!-- very large -->
    <rect x="788" y="0" width="196" height="36" fill="rgba(255,68,68,0.08)" stroke="#666680" stroke-width="0.5"/>
    <!-- critical -->
    <rect x="985" y="0" width="199" height="36" fill="rgba(255,68,68,0.18)" stroke="#666680" stroke-width="0.5"/>

    <!-- segment labels -->
    <g font-size="11" font-weight="500">
      <text x="98"   y="22" fill="#8888a0" text-anchor="middle">very small</text>
      <text x="295"  y="22" fill="#00ffff" text-anchor="middle" font-weight="700">small ← here</text>
      <text x="492"  y="22" fill="#8888a0" text-anchor="middle">medium</text>
      <text x="689"  y="22" fill="#8888a0" text-anchor="middle">large</text>
      <text x="886"  y="22" fill="#8888a0" text-anchor="middle">very large</text>
      <text x="1085" y="22" fill="#ff8888" text-anchor="middle">critical</text>
    </g>
  </g>

  <!-- Tier-strip caption (single small line) -->
  <text x="48" y="294" class="mono" font-size="10" fill="#666680" letter-spacing="2.5">CONTEXT TIER · 6-LEVEL LADDER</text>

  <!-- Bottom thin cyan rule -->
  <line x1="48" y1="304" x2="1232" y2="304" stroke="#00ffff" stroke-width="0.7" opacity="0.45"/>
</svg>
