<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">autonomous-team-coordination plugin banner</title>
  <desc id="bannerDesc">Banner with a dark FORM RCC-000 header band over a cream paper body. The body shows two contrasting models side-by-side: AUTHORITARIAN (leader at the top of a tree, workers below) on the left, DISTRIBUTED (squad-leader as the center of a hub with workers around it) on the right, separated by a large ≠ symbol.</desc>

  <defs>
    <filter id="bannerShadow" x="-1%" y="-3%" width="102%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="bannerGrain" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#f5ecd0"/>
      <rect x="0" y="0" width="1" height="1" fill="#efe3bd" opacity="0.32"/>
      <rect x="2" y="2" width="1" height="1" fill="#e8dcaa" opacity="0.20"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="none"/>

  <!-- Paper sheet -->
  <g filter="url(#bannerShadow)">
    <rect x="20" y="16" width="1240" height="288" fill="url(#bannerGrain)"/>
  </g>

  <!-- Dark header band (compact) -->
  <rect x="20" y="16" width="1240" height="64" fill="#1a1a2e"/>
  <line x1="20" y1="80" x2="1260" y2="80" stroke="#00ffff" stroke-width="2"/>
  <line x1="20" y1="86" x2="1260" y2="86" stroke="#00ffff" stroke-width="0.7" opacity="0.5"/>

  <!-- Header band content -->
  <text x="48" y="42" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="12" fill="#00ffff" letter-spacing="3.5">FORM RCC-000 :: PLUGIN BANNER</text>
  <text x="48" y="68" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="20" font-weight="700" fill="#f5ecd0" letter-spacing="3.5">autonomous-team-coordination</text>

  <!-- right side of header band -->
  <text x="1232" y="42" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="11" fill="rgba(245,236,208,0.7)" text-anchor="end" letter-spacing="2">a really claude code plugin</text>
  <text x="1232" y="70" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="20" font-weight="700" fill="#00ffff" text-anchor="end" letter-spacing="3">[ || ]</text>

  <!-- ============ BODY: two-glyph contrast ============ -->

  <!-- LEFT side: AUTHORITARIAN (tree) -->
  <g>
    <text x="320" y="124" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="11.5" fill="#7a6c44" text-anchor="middle" letter-spacing="3.5">MODEL · A</text>
    <text x="320" y="146" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle" letter-spacing="2.5">AUTHORITARIAN</text>
    <text x="320" y="164" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="11" fill="#7a6c44" text-anchor="middle" letter-spacing="1">leader at the top · spawn ≡ lead</text>

    <!-- Leader box (top) -->
    <rect x="266" y="186" width="108" height="36" fill="#fdf6df" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="266" y="186" width="108" height="11" fill="#1a1a2e"/>
    <text x="320" y="194" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="6" fill="#00ffff" text-anchor="middle" letter-spacing="1.5">SPAWN+LEAD</text>
    <text x="320" y="214" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">LEADER</text>

    <!-- Tree command lines (solid) from leader down to 3 workers -->
    <g stroke="#1f2937" stroke-width="1.4" fill="none">
      <line x1="320" y1="222" x2="320" y2="244"/>
      <line x1="232" y1="244" x2="408" y2="244"/>
      <line x1="232" y1="244" x2="232" y2="262"/>
      <line x1="320" y1="244" x2="320" y2="262"/>
      <line x1="408" y1="244" x2="408" y2="262"/>
    </g>

    <!-- 3 workers in a row -->
    <g>
      <rect x="200" y="262" width="64" height="28" fill="#fdf6df" stroke="#1f2937" stroke-width="1"/>
      <text x="232" y="280" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="8" fill="#1f2937" text-anchor="middle" font-weight="600">WORKER</text>
      <rect x="288" y="262" width="64" height="28" fill="#fdf6df" stroke="#1f2937" stroke-width="1"/>
      <text x="320" y="280" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="8" fill="#1f2937" text-anchor="middle" font-weight="600">WORKER</text>
      <rect x="376" y="262" width="64" height="28" fill="#fdf6df" stroke="#1f2937" stroke-width="1"/>
      <text x="408" y="280" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="8" fill="#1f2937" text-anchor="middle" font-weight="600">WORKER</text>
    </g>
  </g>

  <!-- ============ CENTER: not-equal pivot ============ -->
  <g>
    <text x="640" y="234" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="78" font-weight="700" fill="#007a7a" text-anchor="middle">≠</text>
    <text x="640" y="262" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="9.5" fill="#007a7a" text-anchor="middle" letter-spacing="3.5" font-weight="700">spawn ≠ lead</text>
  </g>

  <!-- ============ RIGHT side: DISTRIBUTED (hub-and-spoke) ============ -->
  <g>
    <text x="960" y="124" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="11.5" fill="#7a6c44" text-anchor="middle" letter-spacing="3.5">MODEL · B</text>
    <text x="960" y="146" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle" letter-spacing="2.5">DISTRIBUTED</text>
    <text x="960" y="164" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="11" fill="#7a6c44" text-anchor="middle" letter-spacing="1">facilitator at the hub · spawn ≠ lead</text>

    <!-- faint outer ring around hub -->
    <circle cx="960" cy="232" r="62" fill="none" stroke="#00bfbf" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.5"/>

    <!-- Worker (top) -->
    <rect x="924" y="178" width="72" height="28" fill="#fdf6df" stroke="#1f2937" stroke-width="1"/>
    <text x="960" y="196" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="8" fill="#1f2937" text-anchor="middle" font-weight="600">WORKER</text>

    <!-- Worker (bottom-left) -->
    <rect x="836" y="262" width="72" height="28" fill="#fdf6df" stroke="#1f2937" stroke-width="1"/>
    <text x="872" y="280" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="8" fill="#1f2937" text-anchor="middle" font-weight="600">WORKER</text>

    <!-- Worker (bottom-right) -->
    <rect x="1012" y="262" width="72" height="28" fill="#fdf6df" stroke="#1f2937" stroke-width="1"/>
    <text x="1048" y="280" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="8" fill="#1f2937" text-anchor="middle" font-weight="600">WORKER</text>

    <!-- Spokes (solid teal) from hub center to each worker -->
    <g stroke="#007a7a" stroke-width="1.6" fill="none">
      <line x1="960" y1="216" x2="960" y2="206"/>
      <line x1="940" y1="248" x2="906" y2="262"/>
      <line x1="980" y1="248" x2="1014" y2="262"/>
    </g>

    <!-- HUB at the geometric center -->
    <rect x="916" y="216" width="88" height="32" fill="#fdf6df" stroke="#007a7a" stroke-width="2"/>
    <rect x="916" y="216" width="88" height="11" fill="#1a1a2e"/>
    <text x="960" y="224" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="6" fill="#00ffff" text-anchor="middle" letter-spacing="1.5">FACILITATOR</text>
    <text x="960" y="242" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="9" font-weight="700" fill="#1f2937" text-anchor="middle">SQUAD-LEADER</text>
  </g>

  <!-- bottom signature -->
  <g transform="translate(48, 282)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#1f2937" stroke-width="0.5"/>
    <text x="0" y="14" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="9" fill="#7a6c44" letter-spacing="2.5">FILED BY · really him</text>
  </g>
  <g transform="translate(1232, 282)">
    <line x1="0" y1="0" x2="-220" y2="0" stroke="#1f2937" stroke-width="0.5"/>
    <text x="0" y="14" font-family="JetBrains Mono, Menlo, Courier, monospace" font-size="9" fill="#7a6c44" letter-spacing="2.5" text-anchor="end">two models · one feature</text>
  </g>
</svg>
